<div class="container py-4">
  <h2 class="mb-4 text-center text-capitalize">{{ categoryName }}</h2>

  <div class="row g-3">
    <div class="col-md-4" *ngFor="let product of products">
      <div class="card h-100 shadow-sm" style="height: 100%;">

        <div style="height: 250px; display: flex; align-items: center; justify-content: center; padding: 10px;">
          <img [src]="product.image" alt="{{ product.title }}" style="max-height: 100%; max-width: 100%; object-fit: contain;" />
        </div>

        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ product.title | slice:0:50 }}...</h5>
          <p class="card-text text-muted">{{ product.price }} $</p>
          <p class="card-text">{{ product.description | slice:0:100 }}...</p>
        </div>

        <div class="card-footer text-center bg-white border-0">
          <a class="btn btn-primary mt-2" [routerLink]="['/product', product.id]">View Details</a>
        </div>

      </div>
    </div>
  </div>
</div>
