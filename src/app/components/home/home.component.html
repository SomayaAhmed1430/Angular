<div class="container text-center py-5">
  <h1>Welcome to Our Store!</h1>
  <p class="lead">Explore the latest products and top categories.</p>
  <a routerLink="/allproducts" class="btn btn-primary mt-3">Shop Now</a>
</div>




<div class="container mt-5">
  <h2 class="text-center mb-4">Featured Products</h2>
  <div class="row">
    <div class="col-md-3 mb-4" *ngFor="let product of products">
      <div class="card h-100">
        <img [src]="product.image" [alt]="product.title" class="product-img" />
        <div class="card-body">
          <h5 class="card-title">{{ product.title }}</h5>
          <p class="card-text">{{ product.price | currency }}</p>
        </div>
        <a class="btn btn-primary mt-2" [routerLink]="['/product', product.id]">View Details</a>
      </div>
    </div>
  </div>
</div>



<app-category></app-category>
