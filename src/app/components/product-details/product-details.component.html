<div class="container mt-5" *ngIf="product">
  <div class="row">
    <div class="col-md-6">
      <img [src]="product.image" class="img-fluid" alt="product.title" />
    </div>
    <div class="col-md-6">
      <h2>{{ product.title }}</h2>
      <p class="text-muted">{{ product.category }}</p>
      <h4 class="text-success">{{ product.price | currency }}</h4>
      <p>{{ product.description }}</p>
    </div>
  </div>
</div>
