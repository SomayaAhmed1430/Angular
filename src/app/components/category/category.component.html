<div class="top-categories mt-5">
  <h3 class="mb-4 text-center">Top Categories</h3>
  <div class="row justify-content-center g-4">
    <div class="col-md-3" *ngFor="let cat of topCategories">
      <div class="card category-card" (click)="goToCategory(cat)" style="cursor: pointer;">
        <img [src]="'/imgs/' + cat + '.jpg'" alt="{{ cat }}" class="card-img category-img">
        <div class="card-img-overlay d-flex flex-column justify-content-end text-white">
          <h5 class="card-title text-capitalize">{{ cat }}</h5>
          <p class="card-text">Explore latest in {{ cat }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
